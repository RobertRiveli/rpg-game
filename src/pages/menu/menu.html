<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../../styles/fontes.css" />
    <link rel="stylesheet" href="../../styles/variaveis.css" />
    <link rel="stylesheet" href="../../styles/reset.css" />
    <link rel="stylesheet" href="../../styles/componentes.css" />

    <link rel="stylesheet" href="menu.css" />
    <title>Menu</title>
  </head>
  <body class="tela-fundo">
    <div class="arvore arvore-esquerda-1"></div>
    <div class="arvore arvore-esquerda-2"></div>
    <div class="arvore arvore-esquerda-3"></div>

    <div class="arvore arvore-direita-1"></div>
    <div class="arvore arvore-direita-2"></div>
    <div class="arvore arvore-direita-3"></div>

    <div class="borda-ornamentada">
      <span class="canto canto-top-esquerdo"></span>
      <span class="canto canto-top-direito"></span>
      <span class="canto canto-inferior-esquerdo"></span>
      <span class="canto canto-inferior-direito"></span>
      <div class="borda-ornamentada-secundaria">
        <div class="secao-bola-ornamentada">
          <div class="bola-ornamentada"></div>
          <div class="bola-ornamentada"></div>
        </div>

        <main>
          <div class="secao-titulo">
            <div class="linhas-superiores">
              <div class="linha-ornamentada linha-superior-esquerda"></div>
              <div class="icone-secao-titulo">
                <svg width="25" height="55" viewBox="0 0 20 50">
                  <polygon points="10,0 15,10 10,14 6,10" fill="#c9a84c" />
                </svg>
              </div>
              <div class="linha-ornamentada linha-superior-direita"></div>
            </div>
            <span class="subtitulo">LAST VIII KINGDOM</span>
            <h1 class="titulo">DESPAIR</h1>
            <div class="linhas-inferiores">
              <div class="linha-ornamentada linha-inferiores-esquerda"></div>
              <div class="triangulo-esquerdo"></div>
              <svg width="25" height="50" viewBox="0 0 20 10">
                <polygon points="10,0 15,10 10,18 6,10" fill="#8a7040" />
              </svg>
              <div class="triangulo-direito"></div>
              <div class="linha-ornamentada linha-inferiores-direita"></div>
            </div>
          </div>

          <section class="menu-section">
            <div class="bola-ornamentada superior"></div>
            <div class="bola-ornamentada inferior"></div>

            <div id="novo-jogo" class="opcao-menu ativa" data-opcao="novo-jogo">
              <div class="triangulo-esquerdo"></div>
              <a href="../game/game.html" class="opcao">NOVO JOGO</a>
            </div>
            <div class="opcao-menu" data-opcao="opcoes">
              <div class="triangulo-esquerdo"></div>
              <a href="" class="opcao">OPÇÕES</a>
            </div>
            <div class="opcao-menu" data-opcao="sair">
              <div class="triangulo-esquerdo"></div>
              <a href="" class="opcao">SAIR</a>
            </div>
          </section>
        </main>
        <div class="secao-bola-ornamentada">
          <div class="bola-ornamentada"></div>
          <div class="bola-ornamentada"></div>
        </div>
      </div>
    </div>

    <script src="menu.js"></script>
  </body>
</html>
