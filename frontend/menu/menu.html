<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="menu.css" />
    <title>Menu</title>
  </head>
  <body>
    <div class="borda-ornamentada">
      <span class="canto canto-top-esquerdo"></span>
      <span class="canto canto-top-direito"></span>
      <span class="canto canto-inferior-esquerdo"></span>
      <span class="canto canto-inferior-direito"></span>
      <div class="borda-ornamentada-secundaria">
        <div class="secao-bola-ornamentada">
          <div class="bola-ornamentada"></div>
          <div class="bola-ornamentada"></div>
        </div>

        <main>
          <div class="secao-titulo">
            <div class="linhas-superiores">
              <div class="linha-secao-titulo linha-superior-esquerda"></div>
              <div class="icone-secao-titulo">
                <svg width="25" height="55" viewBox="0 0 20 50">
                  <polygon points="10,0 15,10 10,14 6,10" fill="#c9a84c" />
                </svg>
              </div>
              <div class="linha-secao-titulo linha-superior-direita"></div>
            </div>
            <span class="subtitulo">LAST VIII KINGDOM</span>
            <h1 class="titulo">DESPAIR</h1>
            <div class="linhas-inferiores">
              <div class="linha-secao-titulo linha-inferiores-esquerda"></div>
              <div class="triangulo-esquerdo"></div>
              <svg width="25" height="50" viewBox="0 0 20 10">
                <polygon points="10,0 15,10 10,18 6,10" fill="#8a7040" />
              </svg>
              <div class="triangulo-direito"></div>
              <div class="linha-secao-titulo linha-inferiores-direita"></div>
            </div>
          </div>

          <section class="menu-section">
            <div>
              <a href="">Novo Jogo</a>
            </div>
            <div>
              <a>Opções</a>
            </div>
            <div>
              <a>Sair</a>
            </div>
          </section>
        </main>
        <div class="secao-bola-ornamentada">
          <div class="bola-ornamentada"></div>
          <div class="bola-ornamentada"></div>
        </div>
      </div>
    </div>
  </body>
</html>
